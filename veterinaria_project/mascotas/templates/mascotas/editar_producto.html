<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar producto</title>
</head>
<body>

    <h1>Editar producto</h1>

    <p>
        Editando: <strong>{{ producto.nombre }}</strong>
    </p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Guardar cambios
        </button>
    </form>

    <br>

    <a href="{% url 'inventario' %}">
        ← Volver al inventario
    </a>

</body>
</html>
