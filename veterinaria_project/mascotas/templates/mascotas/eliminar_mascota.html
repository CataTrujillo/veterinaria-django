<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar mascota</title>
</head>
<body>

    <h1>Eliminar mascota</h1>

    <p>
        ¿Estás seguro de que deseas eliminar a
        <strong>{{ mascota.nombre }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>
    </form>

    <br>

    <a href="{% url 'lista_mascotas' %}">
        Cancelar y volver
    </a>

</body>
</html>
