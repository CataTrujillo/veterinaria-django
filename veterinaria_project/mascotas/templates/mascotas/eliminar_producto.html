<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar producto</title>
</head>
<body>

    <h1>Eliminar producto</h1>

    <p>
        ¿Estás seguro de que deseas eliminar
        <strong>{{ producto.nombre }}</strong> del inventario?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>
    </form>

    <br>

    <a href="{% url 'inventario' %}">
        Cancelar y volver
    </a>

</body>
</html>
